<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balancd Prototyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --sunk:#EEF2EF; --ink:#1D2724; --muted:#56645F; --line:#D9E0DC; --line2:#E7ECE9;
  --accent:#4B6D64; --accent-ink:#FFFFFF; --accent-soft:#E3ECE8; --brand:#8AA49E;
  --warn:#8A4B08; --warn-bg:#FFF1DE; --warn-line:#E8C48E; --ok:#2F6B47; --ok-bg:#E0F0E6; --bad:#8E2F25; --bad-bg:#F8E1DD;
  --t-ini:#CFE2D6; --t-ini-ink:#1E3D30; --t-ind:#D9E4F2; --t-ind-ink:#1F3A5C; --t-cpl:#E8DDF0; --t-cpl-ink:#4B2F5E;
  --t-adhs:#F2E1C2; --t-adhs-ink:#5A3A0C; --t-int:#E4E5DF; --t-int-ink:#3D3F38;
  --bar:#1D2724; --bar-ink:#E9EFEC;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#121816; --surface:#1A221F; --sunk:#151C19; --ink:#E3EAE7; --muted:#9AA8A2; --line:#2E3934; --line2:#25302B;
  --accent:#8FBCAC; --accent-ink:#10231D; --accent-soft:#223630; --warn:#F0B270; --warn-bg:#3A2A18; --warn-line:#6B4A22;
  --ok:#8FD3AA; --ok-bg:#1E3527; --bad:#F0A197; --bad-bg:#3E2320;
  --t-ini:#23402F; --t-ini-ink:#CFE9D9; --t-ind:#1F3247; --t-ind-ink:#D5E5F7; --t-cpl:#34284A; --t-cpl-ink:#E6D8F3;
  --t-adhs:#43331A; --t-adhs-ink:#F4DDB5; --t-int:#2C2E2A; --t-int-ink:#D9DAD3; --bar:#0B100E; --bar-ink:#D8E2DD;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#121816; --surface:#1A221F; --sunk:#151C19; --ink:#E3EAE7; --muted:#9AA8A2; --line:#2E3934; --line2:#25302B;
  --accent:#8FBCAC; --accent-ink:#10231D; --accent-soft:#223630; --warn:#F0B270; --warn-bg:#3A2A18; --warn-line:#6B4A22;
  --ok:#8FD3AA; --ok-bg:#1E3527; --bad:#F0A197; --bad-bg:#3E2320;
  --t-ini:#23402F; --t-ini-ink:#CFE9D9; --t-ind:#1F3247; --t-ind-ink:#D5E5F7; --t-cpl:#34284A; --t-cpl-ink:#E6D8F3;
  --t-adhs:#43331A; --t-adhs-ink:#F4DDB5; --t-int:#2C2E2A; --t-int-ink:#D9DAD3; --bar:#0B100E; --bar-ink:#D8E2DD;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px;font-weight:400;min-width:0}
label.f textarea{min-height:90px;resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* prototype bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--bar-ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;font-size:13px}
.pbar b{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px;opacity:.75}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:inherit;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.pbar .reset{background:none;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}

/* client (phone) */
.phoneWrap{padding-inline:16px;padding-block:24px 60px;display:flex;justify-content:center}
.phone{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(20,40,30,.10)}
.phead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.phead img{height:24px}
.pbody{padding:20px 18px 26px;display:flex;flex-direction:column;gap:16px}
.step{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.h1{font-size:26px;font-weight:700;line-height:1.15}
.switch{display:flex;background:var(--sunk);border-radius:12px;padding:4px}
.switch button{flex:1;border:0;background:none;padding:10px 0;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.opt[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:13px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0}
.opt[aria-pressed="true"] .dot{border:6px solid var(--accent);background:var(--surface)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.person{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;text-align:left;width:100%}
.day{display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day:disabled{opacity:.45;cursor:default}
.slot{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.slot[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.hold{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);font-size:14px}
.hold b{font-size:20px;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--muted)}
.chk input{width:20px;height:20px;flex-shrink:0;margin:1px 0 0;accent-color:var(--accent)}
.summary{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:14px}
.summary span:nth-child(odd){color:var(--muted)}

/* team app */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 44px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side img{height:28px;margin:0 8px 18px;align-self:flex-start}
.nav{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500;cursor:pointer;color:var(--muted);width:100%}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .n{background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.top input[type=search]{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);width:260px;max-width:100%}
.role{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.role button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.content{padding:20px 24px 60px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ptitle h1{font-size:22px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .side img{display:none}
  .nav{width:auto;white-space:nowrap}
  .top,.content{padding-inline:16px}
}
/* calendar */
.calwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.cal{min-width:760px;display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr))}
.cal .hd{height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
.cal .hd.today{background:var(--accent);color:var(--accent-ink)}
.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:12px;color:var(--muted)}
.dcol{position:relative;border-left:1px solid var(--line2);background-image:repeating-linear-gradient(to bottom,var(--line2) 0,var(--line2) 1px,transparent 1px,transparent 56px);cursor:cell}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 7px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;border:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.ev b{font-size:13px;display:flex;justify-content:space-between;gap:4px}
.ev.past{opacity:.8}
.ev .okb{width:17px;height:17px;border-radius:50%;background:#2F6B47;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ev .openb{width:15px;height:15px;border-radius:50%;border:2px solid #B8641A;flex-shrink:0;display:inline-block}
.ev .icons{display:inline-flex;gap:3px}
.ev .bang{width:17px;height:17px;border-radius:50%;background:#B8641A;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ev.block{background:repeating-linear-gradient(45deg,var(--sunk) 0,var(--sunk) 6px,var(--surface) 6px,var(--surface) 12px);color:var(--muted);border:1px solid var(--line)}
.ev.absent{background:var(--warn-bg);color:var(--warn);border:2px dashed var(--warn-line)}
.dcol{touch-action:pan-x;user-select:none;-webkit-user-select:none}
.nowline{position:absolute;left:0;right:0;height:2px;background:#C0392B;pointer-events:none}
.pop{position:fixed;z-index:40;width:330px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.2);padding:16px;display:flex;flex-direction:column;gap:10px}
.sugg{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:var(--surface);padding:8px 10px;cursor:pointer;font-size:14px}
.sugg button:hover{background:var(--sunk)}
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.35);z-index:35}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:36;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer header{display:flex;gap:10px;align-items:center;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.drawer .dbody{padding:16px 18px 40px;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
@media (max-width:760px){.drawer .dbody{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);background:var(--surface);text-align:left;width:100%;cursor:pointer}
.li[aria-current="true"]{background:var(--accent-soft)}
.freegrid{display:grid;grid-template-columns:120px repeat(5,minmax(70px,1fr));gap:6px;font-size:13px;min-width:560px}
.fs{padding:7px 0;text-align:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.fs.none{background:var(--sunk);color:var(--muted);border-color:transparent;cursor:default}
.hist{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.hist summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px}
.hist p{margin:0;padding:0 12px 12px;font-size:14px;white-space:pre-wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:14px}
.hbar i{display:block;height:12px;border-radius:6px;background:var(--brand)}
.hbar .track{background:var(--sunk);border-radius:6px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;width:min(520px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,20,16,.4)}
dialog.wide{width:min(900px,calc(100% - 32px))}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.cmp{grid-template-columns:1fr}}
.cmp textarea,.cmp input,.cmp select{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--bg);width:100%;min-width:0;font-size:15px}
.cmp textarea,.cmp label.f textarea{min-height:260px;line-height:1.5;resize:vertical}
.ai{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ai pre{margin:0;white-space:pre-wrap;font:inherit;font-size:14.5px;line-height:1.5}
.ai .lbl{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.rolehint{font-size:12.5px;padding:6px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:600;flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.toprow{display:flex;gap:12px;align-items:center;flex-wrap:nowrap;min-width:0}.toprow input[type=search]{flex:0 1 260px;min-width:110px}.toprow>.btn{flex-shrink:0;white-space:nowrap}
.ai[hidden]{display:none!important}
@media (max-width:700px){.toprow{overflow-x:auto;scrollbar-width:none}.toprow::-webkit-scrollbar{display:none}.toprow .role button{padding:7px 8px;font-size:12px}.toprow>*{flex-shrink:0}.toprow>.rolehint{flex-shrink:1}.toprow input[type=search]{flex:1 1 120px}}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--sunk);padding:0 12px;font-weight:700;cursor:pointer;min-width:44px}
.stepper{align-self:flex-start}
.stepper input,label.f .stepper input{border:0;border-radius:0;width:72px;padding:9px 4px;text-align:center;font-weight:700;font-size:17px;background:var(--surface);flex:none}
.calc{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.calc b{font-variant-numeric:tabular-nums}
.mail{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px;font-size:14px;line-height:1.5}

/* calendar v2 – wie Google Kalender */
.calbar h1{font-size:21px;min-width:0}
.btn.icon{min-width:40px;padding-inline:10px;font-size:18px;line-height:1}
.calsel{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-weight:600;min-height:40px}
.calgrid-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.mini{display:none}
@media (min-width:1380px){.calgrid-wrap{grid-template-columns:220px minmax(0,1fr)}.mini{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:60px}}
.mini b{font-size:14px}
.mini>.row{flex-wrap:nowrap}
.mini .btn.icon{min-height:30px;min-width:30px;font-size:16px;padding:0}
.minig{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.minig .wd{font-size:11px;color:var(--muted);font-weight:700}
.md{border:0;background:none;border-radius:50%;aspect-ratio:1;font-size:12px;cursor:pointer;color:var(--ink);padding:0}
.md:hover{background:var(--sunk)} .md.out{color:var(--muted);opacity:.6} .md.inr{background:var(--accent-soft)} .md.today{background:var(--accent);color:var(--accent-ink);font-weight:700}
.calwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.calinner{display:flex;flex-direction:column}
.cgh,.cgb{display:grid}
.cgh{border-bottom:1px solid var(--line);scrollbar-gutter:stable;overflow:hidden}
.cgh .hd{border:0;background:none;border-left:1px solid var(--line2);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;font:inherit;color:var(--muted)}

.chip.blk{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.dragging{position:relative;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.25);opacity:.9}
.cgs{overflow-y:auto;max-height:max(420px,calc(100vh - 330px));scrollbar-gutter:stable}
.cgb .hours{position:relative}
.cgb .hours span{position:absolute;right:8px;font-size:11px;color:var(--muted)}
.dcol{position:relative;border-left:1px solid var(--line2);background-image:repeating-linear-gradient(to bottom,var(--line2) 0,var(--line2) 1px,transparent 1px,transparent 48px);cursor:cell;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dcol.pastday{background-color:color-mix(in srgb,var(--sunk) 45%,transparent)}
.dcol.absentday{background-color:var(--warn-bg)}
.ev{position:absolute;border-radius:7px;padding:3px 6px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:0;box-shadow:0 0 0 1px var(--surface)}
.ev b{font-size:12.5px;display:flex;justify-content:space-between;gap:4px;align-items:flex-start}

.ev .tm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.movable{cursor:grab}
.ev.dragging{cursor:grabbing;z-index:6;box-shadow:0 8px 22px rgba(0,0,0,.28);opacity:.95}
.ev.cancelled{opacity:.6;text-decoration:line-through}
.ev.cancelled .pill{text-decoration:none}
.ev .rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;touch-action:none}
.ev .rs::after{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:currentColor;opacity:0}
.ev:hover .rs::after{opacity:.45}
.ev.draft{left:2px;width:calc(100% - 5px);background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:5;pointer-events:none}
.swatch-block{width:12px;height:12px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--sunk) 0,var(--sunk) 3px,var(--surface) 3px,var(--surface) 6px);border:1px solid var(--line)}
.month{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));min-width:700px}
.mh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mcell{min-height:112px;border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px;display:flex;flex-direction:column;gap:2px;cursor:cell;min-width:0}
.mcell.out{background:var(--sunk)} .mcell.out .mdn{color:var(--muted)}
.mdn{align-self:center;border:0;background:none;border-radius:50%;width:26px;height:26px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.mdn:hover{background:var(--sunk)} .mcell .mdn.today{background:var(--accent);color:var(--accent-ink)}
.more{border:0;background:none;font-size:12px;font-weight:700;color:var(--muted);text-align:left;cursor:pointer;padding:1px 6px}
.g3{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,.75fr);gap:8px}

.radio{display:flex;gap:9px;align-items:center;font-size:15px;cursor:pointer}

.pop{max-height:calc(100vh - 70px);overflow-y:auto;overflow-x:hidden;width:370px}
.toast{display:flex;gap:14px;align-items:center}
.toast .undo{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;font-size:14px}

.cbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.lang{display:inline-flex;gap:2px;font-size:13px}

.ibtag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}

.sw-av.site{background:var(--surface)}.sw-av.online{background:radial-gradient(circle,color-mix(in srgb,var(--accent) 60%,transparent) 0 1px,transparent 1.4px) 0 0/5px 5px,var(--surface)}.sw-av.off{background:var(--sunk)}

.chipsel{display:flex;flex-wrap:wrap;gap:6px}

function aiImprove(txt,v){
  let t=txt.replace(/\r/g,"").replace(/[ \t]+/g," ").replace(/ +\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  const fix=[[/ß/g,"ss"],[/\bhallo\b/gi,"Guten Tag"],[/^hi\b/gim,"Guten Tag"],[/\bmfg\b/gi,"Freundliche Grüsse"],[/^(lg|gruss|grüsse|liebe grüsse)$/gim,"Freundliche Grüsse"],
    [/\bsie\b/g,"Sie"],[/\bihnen\b/g,"Ihnen"],[/\bihr(e|en|em|er|es)?\b/g,"Ihr$1"],
    [/\btermin(e|en)?\b/g,"Termin$1"],[/\bwoche(n)?\b/g,"Woche$1"],[/\brechnung(en)?\b/g,"Rechnung$1"],[/\bsitzung(en)?\b/g,"Sitzung$1"],[/\bpraxis\b/g,"Praxis"],
    [/\bsofort\b/g,"so bald wie möglich"],[/\bSie müssen\b/g,"Bitte"],[/\bdanke\b/g,"vielen Dank"],[/!{2,}/g,"."],[/\?{2,}/g,"?"]];
  for(const[a,b]of fix)t=t.replace(a,b);
  t=t.replace(/(^|[.!?]\s+|\n)([a-zäöü])/g,(m,a,b,off,all)=>/(Jan|Feb|Apr|Aug|Sept|Okt|Nov|Dez|z\.B|ca|Nr|bzw|usw)\.\s+$/.test(all.slice(Math.max(0,off-6),off+a.length))?m:a+b.toUpperCase());
  const lines=t.split("\n");
  if(!/^(Guten Tag|Liebe|Lieber|Sehr geehrte)/.test(lines[0]))t="Guten Tag "+(v.vorname||"")+"\n\n"+t;
  if(!/Bei Fragen/.test(t)){const i=t.search(/\n\n(Freundliche|Liebe|Herzliche) Grüsse/);const add="Bei Fragen sind wir gerne für Sie da.";t=i>=0?t.slice(0,i)+"\n\n"+add+t.slice(i):t+"\n\n"+add;}
  if(!/Grüsse/.test(t))t+="\n\nFreundliche Grüsse\n"+(v.absender||"Balancd");
  return t;
}

function busy(psy,start,len){const end=new Date(start.getTime()+len*60000);
  return S.appts.some(a=>a.psy===psy&&!["abgesagt","storniert"].includes(a.status)&&a.start<end&&new Date(a.start.getTime()+(dur(a)+bufOf(a))*60000)>start)||
         S.blocks.some(b=>b.psy===psy&&b.start<end&&new Date(b.start.getTime()+b.dur*60000)>start);}
/* Verfügbarkeit (FR-03, FR-07, FR-13, FR-14): vor Ort = zugeteilte Raum-Halbtage minus Reduktion der Psycholog:in; online = eigene Zeiten pro Wochentag */
const bufOf=a=>{const t=T(a.type);return t&&t.buf?t.buf:0;};
const SLOTH=[8,9,10,11,13,14,15,16,17];
function halfOf(d){return fTime(d)<(S.rules.amEnd||"12:30")?"am":"pm";}
function availOf(psy){if(!S.avail[psy])S.avail[psy]={off:{},online:{},perDay:null};return S.avail[psy];}
function siteOK(psy,d){return !!roomFor(psy,d)&&!availOf(psy).off[d.getDay()+halfOf(d)];}
function onlineOK(psy,d,len){const r=availOf(psy).online[d.getDay()];return !!r&&fTime(d)>=r[0]&&fTime(new Date(d.getTime()+(len||50)*60000))<=r[1];}
function dayCount(psy,day){return S.appts.filter(a=>a.psy===psy&&a.client&&sameDay(a.start,day)&&!["abgesagt","storniert"].includes(a.status)).length;}
function perDayOf(psy){return availOf(psy).perDay||S.rules.perDay;}
function latest(){const x=at(NOW,23,59);x.setMonth(x.getMonth()+S.rules.maxMonths);return x;}
function freeSlots(psy,day,mode,staff){const out=[];if(day.getDay()===0||day.getDay()===6)return out;
  if(absentOn(psy,day))return out;
  if(!staff&&(at(day,23,59)<earliest()||at(day,0)>latest()))return out;
  if(dayCount(psy,day)>=perDayOf(psy))return out;
  for(const hh of SLOTH){const s=at(day,hh);if(s<NOW)continue;
    const ok=mode==="site"?siteOK(psy,s):mode==="online"?onlineOK(psy,s):(siteOK(psy,s)||onlineOK(psy,s));if(!ok)continue;
    const seedv=(day.getDate()*7+hh*3+psy.charCodeAt(0))%6;if(seedv===0)continue;
    if(!busy(psy,s,60))out.push(s);}
  return out;}
function earliest(){return at(addDays(NOW,S.rules.minDays),0);}
function firstFree(psy,mode){for(let d=earliest();d<=latest();d=addDays(d,1)){const f=freeSlots(psy,d,mode);if(f.length)return f[0];}return null;}
function nextFree(filter,mode){let best=null;for(const p of PSY.filter(filter)){const t=firstFree(p.id,mode);if(t&&(!best||t<best.t))best={p,t};}return best;}
